name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  php:
    name: PHP — PHPStan, PHPCS, Pest (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The floor from the `Requires PHP` header and the current release: the
      # floor catches syntax newer than the plugin claims to support, the
      # latest catches deprecations before a host upgrades into them.
      matrix:
        php: [ '8.4', '8.5' ]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPStan (level max)
        run: composer phpstan

      - name: PHPCS (WordPress standard)
        run: composer phpcs

      - name: Pest unit tests
        run: composer test

  node:
    name: Node — build and block-JS gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build blocks
        run: npm run build

      - name: Lint JS (ESLint via wp-scripts)
        run: npm run lint:js

      - name: Lint CSS (Stylelint via wp-scripts)
        run: npm run lint:css

      - name: Block JS unit tests (Jest via wp-scripts)
        run: npm run test:js
